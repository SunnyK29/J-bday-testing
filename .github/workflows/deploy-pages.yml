name: Build and deploy the birthday-to-appreciation journey

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 03:00 UTC on 28 October = 08:30 IST on 28 October 2026.
    - cron: '0 3 28 10 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the single repository
        uses: actions/checkout@v4

      - name: Determine whether the appreciation site can be released
        id: release-check
        shell: bash
        run: |
          RELEASE_EPOCH=$(date -u -d '2026-10-28 03:00:00' +%s)
          NOW_EPOCH=$(date -u +%s)
          if [ "$NOW_EPOCH" -ge "$RELEASE_EPOCH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "The appreciation test-release deadline has passed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The appreciation site will remain encrypted and unpublished until 28 October 2026 at 08:30 IST."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and assemble the website journey
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO_NAME" = "$OWNER.github.io" ]; then
            BASE_PATH=""
          else
            BASE_PATH="/$REPO_NAME"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          export NEXT_PUBLIC_BASE_PATH="$BASE_PATH"

          npm ci
          npm run build

          # The supplied new birthday page is the public starting page.
          cp site-root/index.html out/index.html
          if [ -d site-root/images ]; then
            mkdir -p out/images
            cp -a site-root/images/. out/images/
          fi

          # Second birthday page contains the time-locked Continue button.
          mkdir -p out/birthday
          cp -a birthday/. out/birthday/
          touch out/.nojekyll

      - name: Decrypt and publish appreciation only after the deadline
        if: steps.release-check.outputs.ready == 'true'
        env:
          SORRY_DECRYPTION_KEY: ${{ secrets.SORRY_DECRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SORRY_DECRYPTION_KEY:-}" ]; then
            echo "::error::Add SORRY_DECRYPTION_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in private/appreciation-site.tar.gz.enc \
            -out /tmp/appreciation-site.tar.gz \
            -pass env:SORRY_DECRYPTION_KEY
          mkdir -p out/appreciation
          tar -xzf /tmp/appreciation-site.tar.gz -C out/appreciation
          test -f out/appreciation/index.html
          echo "Appreciation site decrypted and included in this deployment."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
